# Auto-generated by cfgd — manages release tagging for modules and profiles.
# Regenerate with: cfgd workflow generate --force
name: cfgd Release

on:
  push:
    branches: [master]
    paths:
      - 'modules/clift/**'
      - 'modules/jarvis/**'
      - 'modules/nvim/**'
      - 'profiles/base.yaml'
      - 'profiles/base.yml'

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      module_clift: ${{ steps.changes.outputs.module_clift }}
      module_jarvis: ${{ steps.changes.outputs.module_jarvis }}
      module_nvim: ${{ steps.changes.outputs.module_nvim }}
      profile_base: ${{ steps.changes.outputs.profile_base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi
          if echo "$CHANGED" | grep -q '^modules/clift/'; then
            echo "module_clift=true" >> $GITHUB_OUTPUT
          else
            echo "module_clift=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q '^modules/jarvis/'; then
            echo "module_jarvis=true" >> $GITHUB_OUTPUT
          else
            echo "module_jarvis=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q '^modules/nvim/'; then
            echo "module_nvim=true" >> $GITHUB_OUTPUT
          else
            echo "module_nvim=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q '^profiles/base\.'; then
            echo "profile_base=true" >> $GITHUB_OUTPUT
          else
            echo "profile_base=false" >> $GITHUB_OUTPUT
          fi

  tag-modules:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        include:
          - name: clift
            changed: ${{ needs.detect-changes.outputs.module_clift }}
          - name: jarvis
            changed: ${{ needs.detect-changes.outputs.module_jarvis }}
          - name: nvim
            changed: ${{ needs.detect-changes.outputs.module_nvim }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.changed == 'true'
        with:
          fetch-depth: 0
      - name: Read module version
        if: matrix.changed == 'true'
        id: version
        run: |
          VERSION=$(grep -oP 'version:\s*"?\K[^"\s]+' "modules/${{ matrix.name }}/module.yaml" || echo "0.1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Tag module release
        if: matrix.changed == 'true'
        run: |
          TAG="${{ matrix.name }}/v${{ steps.version.outputs.version }}"
          git tag -f "$TAG"
          git push origin "$TAG" --force

  tag-profiles:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        include:
          - name: base
            changed: ${{ needs.detect-changes.outputs.profile_base }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.changed == 'true'
        with:
          fetch-depth: 0
      - name: Tag profile release
        if: matrix.changed == 'true'
        run: |
          DATE=$(date +%Y%m%d)
          TAG="profile/${{ matrix.name }}/${DATE}"
          git tag -f "$TAG"
          git push origin "$TAG" --force
