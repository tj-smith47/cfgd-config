apiVersion: cfgd.io/v1alpha1
kind: Module
metadata:
  name: nvim
  description: Neovim editor — LazyVim-style plugin set with Mason-managed LSP, treesitter, copilot, sops.

spec:
  packages:
  - name: neovim
    minVersion: '0.11'
    prefer:
    - brew
    - snap
    deny:
    - apt                         # Ubuntu LTS ships a neovim too old for this plugin set

  # Native plugins (LuaSnip, telescope-fzf-native, tiktoken, treesitter parsers) build with make + a C compiler.
  - name: gcc
    aliases:
      apt: build-essential
      dnf: '@development-tools'
    platforms:
    - linux
  - name: make
    platforms:
    - linux
  - name: unzip
  - name: git
  - name: curl

  - name: ripgrep
  - name: fd
    # apt installs the binary as `fdfind`; brew and cargo install it as `fd`, which telescope expects.
    prefer:
    - brew
    - cargo
    - apt
    aliases:
      apt: fd-find
      cargo: fd-find
  - name: zoxide
    prefer:
    - brew
    - cargo
    - apt

  # Clipboard providers; harmless headless, OSC52 covers SSH-only sessions.
  - name: xclip
    platforms:
    - linux
  - name: wl-clipboard
    platforms:
    - linux
  - name: xdg-utils
    platforms:
    - linux

  - name: node
    minVersion: '18'
    prefer:
    - brew
    - apt
    aliases:
      apt: nodejs
  - name: npm                     # apt's nodejs does not always include npm
    platforms:
    - linux
  - name: yarn
    prefer:
    - npm
    - brew
  - name: neovim                  # the npm provider package, distinct from the editor entry above
    prefer:
    - npm

  - name: python3
  - name: pip
    aliases:
      apt: python3-pip
    platforms:
    - linux
  - name: python3-venv            # pipx and dap-python need a real venv
    aliases:
      dnf: python3-virtualenv
    platforms:
    - linux
  - name: pipx
    prefer:
    - brew
    - apt
  - name: pynvim
    prefer:
    - pipx

  - name: go
    minVersion: '1.25'
    prefer:
    - brew
    - apt

  # No minVersion: noble's cargo is too old to build stylua, and an unmet floor fails the whole module.
  - name: cargo
    aliases:
      brew: rust
  - name: stylua
    prefer:
    - brew
    - cargo

  # No minVersion for the same reason; solargraph wants 3.1 but rubocop still installs below it.
  - name: ruby
    prefer:
    - apt
    - brew
    aliases:
      apt: ruby-full
      dnf: ruby-devel
  # solargraph's psych gem compiles against libyaml headers, which ruby-full does not pull in.
  - name: libyaml
    prefer:
    - apt
    - brew
    aliases:
      apt: libyaml-dev
      dnf: libyaml-devel

  - name: sops
    prefer:
    - brew
    - apt
  - name: age
    prefer:
    - brew
    - apt

  files:
  - source: files/init.lua
    target: ~/.config/nvim/init.lua
  - source: files/lazy-lock.json
    target: ~/.config/nvim/lazy-lock.json
  - source: files/stylua.toml
    target: ~/.config/nvim/stylua.toml
  - source: files/lua
    target: ~/.config/nvim/lua
  - source: files/after
    target: ~/.config/nvim/after
  - source: files/queries          # ahead of every plugin on the runtimepath, so these queries win
    target: ~/.config/nvim/queries

  env:
  - name: EDITOR
    value: nvim
  - name: VISUAL
    value: nvim
  - name: PATH
    value: $HOME/.local/bin:$HOME/go/bin:$HOME/.cargo/bin:$PATH
  # Homebrew's ruby is keg-only on macOS; without it `gem` is the system Ruby 2.6.
  - name: PATH
    platforms: [macos]
    value: /opt/homebrew/opt/ruby/bin:/usr/local/opt/ruby/bin:$PATH

  aliases:
  - name: v
    command: nvim
  - name: vim
    command: nvim
  - name: vi
    command: nvim

  scripts:
    postApply:
    - run: |
        if command -v pipx >/dev/null 2>&1; then
          pipx install --force pynvim 2>&1 | tail -5 || true
        fi
      timeout: 120s
      continueOnError: true
    # Park lazy.nvim itself on the locked commit, or its first start rewrites the lock from the `stable` tag.
    - run: |
        lazy="$HOME/.local/share/nvim/lazy/lazy.nvim"
        want=$(sed -n 's/.*"lazy.nvim": {[^}]*"commit": "\([0-9a-f]*\)".*/\1/p' "$HOME/.config/nvim/lazy-lock.json")
        [ -n "$want" ] || exit 0
        [ -d "$lazy/.git" ] || git clone --filter=blob:none https://github.com/folke/lazy.nvim.git "$lazy"
        git -C "$lazy" rev-parse --verify -q "$want^{commit}" >/dev/null || git -C "$lazy" fetch -q origin
        git -C "$lazy" checkout -q "$want"
      timeout: 120s
    # `+qa!` everywhere: a modified scratch buffer would otherwise hold nvim open for the whole timeout.
    - run: |
        nvim --headless "+Lazy! restore" +qa!
      timeout: 900s
    # nvim-treesitter is lazy-loaded; `Lazy! load` runs its sync_install so the parsers compile here, not on first launch.
    - run: |
        nvim --headless "+Lazy! load nvim-treesitter" "+TSUpdateSync" +qa!
      timeout: 900s
    - run: |
        nvim --headless "+MasonToolsInstallSync" +qa!
      timeout: 900s               # ~370s cold; past that the step is stuck, not slow
    # go.nvim is lazy-loaded on go filetypes, so headless must load it before :GoInstallBinaries exists.
    - run: |
        nvim --headless "+Lazy! load go.nvim" "+GoInstallBinaries" +qa!
      timeout: 300s
      continueOnError: true
    # markdown-preview's build hook is gated on a UI, so headless installs skip it.
    - run: |
        mp="$HOME/.local/share/nvim/lazy/markdown-preview.nvim/app"
        if [ -d "$mp" ]; then
          cd "$mp"
          if command -v yarn >/dev/null 2>&1; then
            yarn install --frozen-lockfile
          else
            npm install --no-audit --no-fund
          fi
        fi
      timeout: 180s
      continueOnError: true
